name: 测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行单元测试
        run: python -m unittest -v test_元宝每日任务.py
      - name: 编译检查
        run: python -m py_compile 元宝每日任务.py 视觉安卓代理.py test_元宝每日任务.py
